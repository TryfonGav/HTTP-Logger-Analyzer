name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Linux GCC",          os: ubuntu-24.04, cc: gcc,   cxx: g++,     preset: ci }
          - { name: "Linux Clang + ASan", os: ubuntu-24.04, cc: clang, cxx: clang++, preset: ci-asan }
          - { name: "Windows MSVC",       os: windows-2022, cc: cl,    cxx: cl,      preset: ci }
          - { name: "Linux GCC + coverage", os: ubuntu-24.04, cc: gcc, cxx: g++,     preset: ci-coverage, coverage: true }
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache
    steps:
      - uses: actions/checkout@v4

      # The runners come with a preinstalled vcpkg, but its version changes over time and can be
      # older than our builtin-baseline (vcpkg then fails with "failed to git show
      # versions/baseline.json"). So we clone vcpkg ourselves at exactly the baseline commit
      # written in vcpkg.json, which keeps that file the only place the version is recorded.
      - name: Set up vcpkg at the builtin-baseline commit
        shell: bash
        run: |
          baseline=$(jq -r '."builtin-baseline"' vcpkg.json)
          echo "vcpkg baseline: $baseline"
          git clone --quiet https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          git -C "$RUNNER_TEMP/vcpkg" checkout --quiet "$baseline"
          if [ "$RUNNER_OS" = "Windows" ]; then
            "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.bat" -disableMetrics
          else
            "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          fi
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.vcpkg-cache
          key: vcpkg-${{ matrix.os }}-${{ matrix.preset }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ matrix.os }}-${{ matrix.preset }}-

      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      # Only the coverage job: running the tests above wrote .gcda files into the build folder;
      # gcovr turns them into an HTML report. --filter keeps only our core library (not the tests
      # or the vcpkg libraries), because the core is the code the coverage target is about.
      - name: Coverage report (gcovr)
        if: matrix.coverage
        run: |
          sudo apt-get install -y gcovr
          mkdir -p build/${{ matrix.preset }}/coverage
          gcovr --root . --filter src/core/ --print-summary \
                --html-details build/${{ matrix.preset }}/coverage/index.html \
                build/${{ matrix.preset }}

      - name: Upload coverage report
        if: matrix.coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/${{ matrix.preset }}/coverage/

  format:
    name: clang-format check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Pin the clang-format version: different versions format some code differently,
      # so an unpinned "latest" could make this check fail without any change on our side.
      - run: sudo apt-get update && sudo apt-get install -y clang-format-18
      - run: git ls-files '*.cpp' '*.hpp' '*.h' | xargs --no-run-if-empty clang-format-18 --dry-run --Werror
